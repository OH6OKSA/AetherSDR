name: Mobile Android

# Builds the OksaSDR Android APK (arm64) from the same code as the iOS app
# and uploads it as a run artifact. Runs on mobile/** and android/** branches
# when something that goes into the app changes, and on demand. On
# mobile/oksasdr, a release-signed APK whose mobile/android/release.env names
# a tag not yet on GitHub is published as that prerelease (see the release
# job).
on:
  workflow_dispatch:
  push:
    branches: ['mobile/**', 'android/**']
    paths:
      - 'src/**'
      - 'resources/**'
      - 'third_party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'mobile/CMakeLists.txt'
      - 'mobile/src/**'
      - 'mobile/qml/**'
      - 'mobile/shaders/**'
      - 'mobile/android/**'
      - 'mobile/tools/build-fftw-android.sh'
      - '.github/workflows/mobile-android.yml'

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

# Same Qt pin as cmake/qt-pin.env and mobile-ios.yml.
env:
  QT_VERSION: '6.12.0'
  QT_PACKAGE_REVISION: '202609280346'
  AQTINSTALL_VERSION: '3.3.0'
  PY7ZR_VERSION: '1.1.3'
  FFTW_VERSION: '3.3.10'
  FFTW_SHA256: '56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467'
  # The NDK Qt 6.12 for Android is built with.
  NDK_VERSION: '27.2.12479018'
  ANDROID_ABI: 'arm64-v8a'
  # KDAB android_openssl (Qt's prebuilt OpenSSL 3 for Android), pinned.
  ANDROID_OPENSSL_COMMIT: 'b71f147'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      signed: ${{ env.HAS_SIGNING }}
    env:
      # Release signing switches on once these repository secrets exist:
      # ANDROID_KEYSTORE_B64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the APK is
      # signed with a throwaway key, which cannot update an installed build.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android NDK, platform and build tools
        run: |
          set -o pipefail
          sudo apt-get install -y -qq ninja-build >/dev/null
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Restore Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_PACKAGE_REVISION }}-android-${{ env.ANDROID_ABI }}+linux-aqt${{ env.AQTINSTALL_VERSION }}-mm.ws

      - name: Install Qt (Android + Linux host) via aqtinstall
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/aqtvenv"
          "$RUNNER_TEMP/aqtvenv/bin/pip" install -q "aqtinstall==${AQTINSTALL_VERSION}" "py7zr==${PY7ZR_VERSION}"
          "$RUNNER_TEMP/aqtvenv/bin/aqt" install-qt linux android "$QT_VERSION" android_arm64_v8a --autodesktop \
            -m qtmultimedia qtwebsockets \
            --outputdir "${{ github.workspace }}/Qt"

      - name: Export Qt environment
        run: |
          set -o pipefail
          ls "${{ github.workspace }}/Qt/$QT_VERSION/"
          QT_ANDROID="${{ github.workspace }}/Qt/$QT_VERSION/android_arm64_v8a"
          QT_HOST="$(ls -d "${{ github.workspace }}/Qt/$QT_VERSION/"*gcc_64 | head -1)"
          test -x "$QT_ANDROID/bin/qt-cmake" || { echo "ERROR: no qt-cmake at $QT_ANDROID"; exit 1; }
          test -d "$QT_HOST" || { echo "ERROR: no Linux host Qt"; exit 1; }
          echo "QT_ANDROID=$QT_ANDROID" >> "$GITHUB_ENV"
          echo "QT_HOST=$QT_HOST" >> "$GITHUB_ENV"

      - name: Restore FFTW (Android)
        id: cache-fftw
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fftw-android
          key: fftw-${{ env.FFTW_VERSION }}-android-${{ env.ANDROID_ABI }}-ndk${{ env.NDK_VERSION }}-v1

      - name: Build FFTW (Android)
        if: steps.cache-fftw.outputs.cache-hit != 'true'
        run: mobile/tools/build-fftw-android.sh "$ANDROID_ABI" "$RUNNER_TEMP/fftw-android"

      - name: OpenSSL for the APK (KDAB android_openssl)
        run: |
          set -o pipefail
          git clone -q --filter=blob:none --no-checkout https://github.com/KDAB/android_openssl.git "$RUNNER_TEMP/android_openssl"
          cd "$RUNNER_TEMP/android_openssl"
          git sparse-checkout set "ssl_3/$ANDROID_ABI"
          git checkout -q "$ANDROID_OPENSSL_COMMIT"
          ls -la "ssl_3/$ANDROID_ABI"

      - name: Configure (Android, AETHER_MOBILE)
        run: |
          set -o pipefail
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/fftw-android/lib/pkgconfig"
          "$QT_ANDROID/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fftw-android" \
            -DCMAKE_FIND_ROOT_PATH="$RUNNER_TEMP/fftw-android" \
            -DAETHER_USE_PINNED_QT=OFF \
            -DAETHER_MOBILE=ON \
            -DAETHER_MOBILE_BUILD_NUMBER="${{ github.run_number }}" \
            -DAETHER_ANDROID_OPENSSL_DIR="$RUNNER_TEMP/android_openssl" \
            2>&1 | tee configure.log

      - name: Build APK
        run: |
          set -o pipefail
          cmake --build build-android --target apk 2>&1 | tee build.log
          ls -la build-android/mobile/android-build/build/outputs/apk/release/

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          unsigned=build-android/mobile/android-build/build/outputs/apk/release/android-build-release-unsigned.apk
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$unsigned" aligned.apk
          ks="$RUNNER_TEMP/sign.jks"
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            alias="$KEY_ALIAS"; pass="$KEYSTORE_PASSWORD"; keypass="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No release keystore secrets: signing with a throwaway key (cannot update an installed build)."
            alias=throwaway; pass=throwaway; keypass=throwaway
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$keypass" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 30 -dname "CN=OksaSDR CI" >/dev/null 2>&1
          fi
          out="OksaSDR-android-${{ github.run_number }}.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$ks" --ks-pass "pass:$pass" --key-pass "pass:$keypass" \
            --ks-key-alias "$alias" --out "$out" aligned.apk
          rm -f "$ks" aligned.apk
          "$BUILD_TOOLS/apksigner" verify "$out"
          echo "APK=$out" >> "$GITHUB_ENV"
          echo "Built $out ($(du -h "$out" | cut -f1)) from ${GITHUB_SHA::8}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OksaSDR-android-${{ github.run_number }}
          path: ${{ env.APK }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.run_number }}
          path: |
            configure.log
            build.log
          retention-days: 7

  # GitHub Release for testers, from mobile/android/release.env (TAG, TITLE)
  # and mobile/android/RELEASE_NOTES.md: published once per tag, only from
  # mobile/oksasdr and only with the release key (a throwaway-signed APK
  # could not update an installed one).
  release:
    needs: android-apk
    if: github.ref == 'refs/heads/mobile/oksasdr' && needs.android-apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release wanted?
        id: want
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=mobile/android/release.env
          if [ ! -f "$f" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # shellcheck disable=SC1090
          . "$f"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "publish=true"; echo "tag=$TAG"; echo "title=$TITLE"; echo "asset=$ASSET"; } >> "$GITHUB_OUTPUT"
      - name: Download APK
        if: steps.want.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: OksaSDR-android-${{ github.run_number }}
      - name: Publish prerelease
        if: steps.want.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv OksaSDR-android-${{ github.run_number }}.apk "${{ steps.want.outputs.asset }}"
          gh release create "${{ steps.want.outputs.tag }}" "${{ steps.want.outputs.asset }}" \
            --prerelease --target "$GITHUB_SHA" --title "${{ steps.want.outputs.title }}" \
            --notes-file mobile/android/RELEASE_NOTES.md
          echo "Published ${{ steps.want.outputs.tag }} with ${{ steps.want.outputs.asset }}." >> "$GITHUB_STEP_SUMMARY"
