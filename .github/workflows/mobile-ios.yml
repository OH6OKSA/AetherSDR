name: Mobile iOS engine

# Compile-only check that libaethercore builds for iOS arm64 (AETHER_MOBILE).
# Runs on mobile/** branches and on demand; no signing, no app bundle yet.
on:
  workflow_dispatch:
  push:
    branches: ['mobile/**']

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

# Same Qt pin as cmake/qt-pin.env (tools/check_qt_pin.py does not cover this
# file yet; keep the two values in step by hand).
env:
  QT_VERSION: '6.12.0'
  QT_PACKAGE_REVISION: '202609280346'
  AQTINSTALL_VERSION: '3.3.0'
  PY7ZR_VERSION: '1.1.3'
  FFTW_VERSION: '3.3.10'
  FFTW_SHA256: '56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467'
  # Qt 6.12's iOS binaries are built for iOS 18.0; linking lower only warns
  # and would not run on older devices anyway.
  IOS_DEPLOYMENT_TARGET: '18.0'

jobs:
  ios-engine:
    # App Store Connect accepts only uploads built with Xcode 26 / the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 150
    env:
      # TestFlight signing switches on once these repository secrets exist:
      # APPLE_TEAM_ID, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID,
      # APPSTORE_API_KEY_P8 (the .p8 file's contents). The bundle ID comes
      # from the repository variable AETHER_MOBILE_BUNDLE_ID.
      HAS_SIGNING: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' && secrets.APPSTORE_API_KEY_P8 != '' }}
      BUNDLE_ID: ${{ vars.AETHER_MOBILE_BUNDLE_ID || 'com.aethersdr.mobile' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: command -v ninja || brew install ninja

      - name: Select Xcode
        run: |
          set -o pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Restore Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_PACKAGE_REVISION }}-ios+macos-aqt${{ env.AQTINSTALL_VERSION }}-mm.ws

      - name: Install Qt (iOS + macOS host) via aqtinstall
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/aqtvenv"
          "$RUNNER_TEMP/aqtvenv/bin/pip" install -q "aqtinstall==${AQTINSTALL_VERSION}" "py7zr==${PY7ZR_VERSION}"
          "$RUNNER_TEMP/aqtvenv/bin/aqt" install-qt mac ios "$QT_VERSION" ios --autodesktop \
            -m qtmultimedia qtwebsockets \
            --outputdir "${{ github.workspace }}/Qt"

      - name: Export Qt environment
        run: |
          set -o pipefail
          QT_IOS="${{ github.workspace }}/Qt/$QT_VERSION/ios"
          QT_HOST="${{ github.workspace }}/Qt/$QT_VERSION/macos"
          ls "${{ github.workspace }}/Qt/$QT_VERSION/"
          test -x "$QT_IOS/bin/qt-cmake" || { echo "ERROR: no qt-cmake at $QT_IOS"; exit 1; }
          echo "QT_IOS=$QT_IOS" >> "$GITHUB_ENV"
          echo "QT_HOST=$QT_HOST" >> "$GITHUB_ENV"

      - name: Restore FFTW (iOS arm64)
        id: cache-fftw
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fftw-ios
          key: fftw-${{ env.FFTW_VERSION }}-ios-arm64-${{ env.IOS_DEPLOYMENT_TARGET }}-v1

      # WDSP and NR2 need double precision; NR4 (libspecbleach) needs float.
      - name: Build FFTW for iOS arm64
        if: steps.cache-fftw.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o fftw.tar.gz "https://www.fftw.org/fftw-${FFTW_VERSION}.tar.gz"
          echo "${FFTW_SHA256}  fftw.tar.gz" | shasum -a 256 -c -
          tar xzf fftw.tar.gz
          for prec in double float; do
            extra=""
            if [ "$prec" = float ]; then extra="-DENABLE_FLOAT=ON -DENABLE_NEON=ON"; fi
            cmake -S "fftw-${FFTW_VERSION}" -B "fftw-build-$prec" -G Ninja \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/fftw-ios" $extra
            cmake --build "fftw-build-$prec" --parallel
            cmake --install "fftw-build-$prec"
          done
          ls -la "$RUNNER_TEMP/fftw-ios/lib"

      - name: Configure (iOS, AETHER_MOBILE)
        run: |
          set -o pipefail
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/fftw-ios/lib/pkgconfig"
          "$QT_IOS/bin/qt-cmake" -S . -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fftw-ios" \
            -DCMAKE_FIND_ROOT_PATH="$RUNNER_TEMP/fftw-ios" \
            -DAETHER_USE_PINNED_QT=OFF \
            2>&1 | tee configure.log

      - name: Build aethercore (keep going)
        run: |
          set -o pipefail
          cmake --build build-ios --target aethercore -- -k 0 2>&1 | tee build.log

      - name: Build aether-mobile app (link, unsigned)
        run: |
          set -o pipefail
          cmake --build build-ios --target aether-mobile -- -k 0 2>&1 | tee app.log
          app="$(find build-ios/mobile -maxdepth 2 -name 'aether-mobile.app' -type d | head -1)"
          test -n "$app" || { echo "ERROR: no aether-mobile.app produced"; exit 1; }
          # An .ipa is the bundle under Payload/; sideloading tools re-sign it
          # with the installer's own Apple ID.
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload aether-mobile-unsigned.ipa
          ls -la aether-mobile-unsigned.ipa
      - name: Configure Xcode project (iOS app)
        run: |
          set -o pipefail
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/fftw-ios/lib/pkgconfig"
          team=""
          if [ "$HAS_SIGNING" = "true" ]; then team="${{ secrets.APPLE_TEAM_ID }}"; fi
          "$QT_IOS/bin/qt-cmake" -S . -B build-xcode -G Xcode \
            -DQT_HOST_PATH="$QT_HOST" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fftw-ios" \
            -DCMAKE_FIND_ROOT_PATH="$RUNNER_TEMP/fftw-ios" \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DAETHER_USE_PINNED_QT=OFF \
            -DAETHER_MOBILE_BUNDLE_ID="$BUNDLE_ID" \
            -DAETHER_MOBILE_BUILD_NUMBER="${{ github.run_number }}" \
            -DAETHER_MOBILE_TEAM_ID="$team" \
            2>&1 | tee xcode-configure.log
      - name: Archive (unsigned check, no secrets)
        if: env.HAS_SIGNING != 'true'
        run: |
          set -o pipefail
          xcodebuild -project build-xcode/AetherSDR.xcodeproj -scheme aether-mobile \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/aether-mobile.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcode-archive.log | grep -E "error:|warning: .*aether-mobile|ARCHIVE" || true
          test -d "$RUNNER_TEMP/aether-mobile.xcarchive/Products/Applications/aether-mobile.app"
      - name: Archive, sign and upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s\n' "$API_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID")
          # Archive unsigned: an automatically signed archive uses a
          # development profile, which needs registered devices. Export
          # signs for App Store Connect with cloud-managed distribution
          # signing, which needs none.
          xcodebuild -project build-xcode/AetherSDR.xcodeproj -scheme aether-mobile \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/aether-mobile.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcode-archive.log | grep -E "error:|ARCHIVE" || true
          test -d "$RUNNER_TEMP/aether-mobile.xcarchive"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/aether-mobile.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}" 2>&1 | tee xcode-export.log
          rm -f "$key"
          echo "Uploaded build ${{ github.run_number }} of $BUNDLE_ID to App Store Connect (TestFlight)." >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize errors
        if: always()
        run: |
          {
            echo "## iOS aethercore build"
            echo
            echo "Configure errors:"
            echo '```'
            grep -E "CMake Error|FATAL" configure.log 2>/dev/null | head -50 || true
            echo '```'
            echo "Compile errors (unique, first 150):"
            echo '```'
            grep -E "error:" build.log 2>/dev/null | sed -E 's#^.*/(src|third_party)/#\1/#' | sort -u | head -150 || true
            echo '```'
            echo "App compile/link errors (first 150):"
            echo '```'
            grep -E "error:|Undefined symbols|ld: " app.log 2>/dev/null | sed -E 's#^.*/(src|mobile|third_party)/#\1/#' | sort -u | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        # Diagnostics only: an artifact-service outage must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-engine-logs
          path: |
            configure.log
            build.log
            app.log
            xcode-configure.log
            xcode-archive.log
            xcode-export.log
            build-ios/CMakeCache.txt
            build-ios/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
      - name: Upload unsigned app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aether-mobile-unsigned-ipa
          path: aether-mobile-unsigned.ipa
          if-no-files-found: error
